services:
  - type: web
    name: quantra-ai-engine
    env: python
    rootDir: apps/ai_engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
